name: Build and Deploy to Artifact Registry
on:
  push:
    branches:
      - main

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Bump version
        id: bump
        run: |
          npm version patch -m "chore: bump version to %s [skip ci]"
          git push origin main
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ✅ Auth via Workload Identity Federation (no JSON key)
      # IMPORTANT: request an access token so we can login to Artifact Registry without gcloud token refresh weirdness
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCR_PROJECT_ID }}
          token_format: "access_token"
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # ✅ Confirm gcloud can run (no interactive login)
      - name: Who am I (gcloud)
        run: |
          gcloud config set project "${{ secrets.GCR_PROJECT_ID }}"
          gcloud auth list
          gcloud config list

      # ✅ Docker login using the access token output from the auth action
      - name: Docker login to Artifact Registry
        run: |
          echo "${{ steps.auth.outputs.access_token }}" \
            | docker login -u oauth2accesstoken --password-stdin \
              "${{ secrets.GCR_REGION }}-docker.pkg.dev"

      - name: Build
        run: |
          docker build \
            --tag "${{ secrets.GCR_REGION }}-docker.pkg.dev/${{ secrets.GCR_PROJECT_ID }}/${{ secrets.GCR_REPOSITORY }}/${{ secrets.GCR_IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}" \
            .

      - name: Publish
        run: |
          docker push "${{ secrets.GCR_REGION }}-docker.pkg.dev/${{ secrets.GCR_PROJECT_ID }}/${{ secrets.GCR_REPOSITORY }}/${{ secrets.GCR_IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.GCR_IMAGE_NAME }} \
            --image "${{ secrets.GCR_REGION }}-docker.pkg.dev/${{ secrets.GCR_PROJECT_ID }}/${{ secrets.GCR_REPOSITORY }}/${{ secrets.GCR_IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}" \
            --region ${{ secrets.GCR_REGION }} \
            --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --platform managed \
            --allow-unauthenticated \
            --cpu 0.08 \
            --memory 128Mi \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 1 \
            --cpu-throttling \
            --execution-environment gen1
