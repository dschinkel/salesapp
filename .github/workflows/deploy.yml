# This workflow builds and pushes the Docker image to Google Artifact Registry and deploys to Cloud Run
# using Workload Identity Federation (no JSON keys).

name: Build and Deploy to Artifact Registry
on:
  push:
    branches:
      - main

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # needed for rebase/push + tags

      - name: Setup Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Optional debug (safe): helps confirm repo/ref match your WIF condition
      - name: Debug GitHub context
        run: |
          echo "repository: $GITHUB_REPOSITORY"
          echo "ref:        $GITHUB_REF"
          echo "ref_name:   $GITHUB_REF_NAME"
          echo "sha:        $GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # ✅ Fixes non-fast-forward pushes by rebasing on origin/main and pushing tags
      - name: Bump version
        id: bump
        run: |
          git fetch origin main
          git fetch --tags origin
          git checkout main
          git reset --hard origin/main

          CURRENT_VERSION=$(node -p "require('./package.json').version")
          MAJOR=$(echo "$CURRENT_VERSION" | cut -d. -f1)
          MINOR=$(echo "$CURRENT_VERSION" | cut -d. -f2)
          PATCH=$(echo "$CURRENT_VERSION" | cut -d. -f3)

          NEXT_PATCH=$PATCH
          while true; do
            NEXT_PATCH=$((NEXT_PATCH + 1))
            CANDIDATE_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
            if git rev-parse -q --verify "refs/tags/v${CANDIDATE_VERSION}" >/dev/null; then
              continue
            fi
            break
          done

          npm version "${CANDIDATE_VERSION}" --no-git-tag-version
          git add package.json
          git commit -m "chore: bump version to ${CANDIDATE_VERSION} [skip ci]"
          git tag -a "v${CANDIDATE_VERSION}" -m "chore: bump version to ${CANDIDATE_VERSION} [skip ci]"

          # minimize race conditions if another push happened while we were bumping
          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main --follow-tags

          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ✅ Auth via Workload Identity Federation (no JSON key)
      # NOTE: GCP_WIF_SERVICE_ACCOUNT must be a raw email like:
      # deploy-service-account@YOUR_PROJECT_ID.iam.gserviceaccount.com
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ secrets.GCR_PROJECT_ID }}
          token_format: "access_token"
          create_credentials_file: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Who am I (gcloud)
        run: |
          gcloud config set project "${{ secrets.GCR_PROJECT_ID }}"
          gcloud auth list
          gcloud config list

      # ✅ Robust login for Artifact Registry using the access token from auth@v2
      - name: Docker login to Artifact Registry
        run: |
          echo "${{ steps.auth.outputs.access_token }}" \
            | docker login -u oauth2accesstoken --password-stdin \
              "${{ secrets.GCR_REGION }}-docker.pkg.dev"

      - name: Build
        run: |
          docker build \
            --tag "${{ secrets.GCR_REGION }}-docker.pkg.dev/${{ secrets.GCR_PROJECT_ID }}/${{ secrets.GCR_REPOSITORY }}/${{ secrets.GCR_IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}" \
            .

      - name: Publish
        run: |
          docker push "${{ secrets.GCR_REGION }}-docker.pkg.dev/${{ secrets.GCR_PROJECT_ID }}/${{ secrets.GCR_REPOSITORY }}/${{ secrets.GCR_IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ secrets.GCR_IMAGE_NAME }} \
            --image "${{ secrets.GCR_REGION }}-docker.pkg.dev/${{ secrets.GCR_PROJECT_ID }}/${{ secrets.GCR_REPOSITORY }}/${{ secrets.GCR_IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}" \
            --region ${{ secrets.GCR_REGION }} \
            --set-env-vars="GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --platform managed \
            --allow-unauthenticated \
            --cpu 0.08 \
            --memory 128Mi \
            --concurrency 1 \
            --min-instances 0 \
            --max-instances 1 \
            --cpu-throttling \
            --execution-environment gen1
